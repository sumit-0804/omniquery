[project]
name = "omniquery"
version = "0.1.0"
description = "Multi-agent natural language interface over data sources"
requires-python = ">=3.11.9"
dependencies = [
    "altair>=6.3.0",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.0",
    "langchain-typesafe>=0.0.1a3",
    "langgraph>=1.2.11",
    "limits>=5.8.0",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "requests>=2.32",
    "sqlglot>=30.19.0",
    "tzdata>=2026.4 ; sys_platform == 'win32'",
    "uvicorn>=0.53.0",
]

[project.scripts]
omniquery = "main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "utils", "Models", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running Postgres with the demo data"]
